name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate tag matches application version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use the numeric version format, for example 0.6.0: $tag" >&2
            exit 1
          fi
          version=$(sed -n 's/^var version = "\([^"]*\)".*/\1/p' main.go)
          if [[ "$version" != "$tag" ]]; then
            echo "Tag $tag does not match main.go version $version." >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

  build-windows:
    name: Build Windows x86_64
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ZIP archive
        shell: pwsh
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "${{ github.ref_name }}"
          $packageName = "agres-$version-windows-x86_64"
          $packageDir = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          go build -trimpath -ldflags "-s -w" -o (Join-Path $packageDir "agres.exe") .
          $actualVersion = & (Join-Path $packageDir "agres.exe") --version
          if ($actualVersion -ne "agres $version") {
            throw "Built version '$actualVersion' does not match tag '$version'."
          }
          Copy-Item -LiteralPath "LICENSE", "README.md" -Destination $packageDir
          Compress-Archive -LiteralPath $packageDir -DestinationPath "dist/$packageName.zip"

      - name: Upload Windows archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows-x86_64
          path: dist/agres-*-windows-x86_64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-linux:
    name: Build Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build tar.gz archive
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package_name="agres-$version-linux-x86_64"
          package_dir="dist/$package_name"
          mkdir -p "$package_dir"
          go build -trimpath -ldflags "-s -w" -o "$package_dir/agres" .
          actual_version=$("$package_dir/agres" --version)
          if [[ "$actual_version" != "agres $version" ]]; then
            echo "Built version '$actual_version' does not match tag '$version'." >&2
            exit 1
          fi
          cp LICENSE README.md "$package_dir/"
          tar -C dist -czf "dist/$package_name.tar.gz" "$package_name"

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-linux-x86_64
          path: dist/agres-*-linux-x86_64.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build-macos:
    name: Build macOS Universal
    needs: validate
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Universal Binary ZIP archive
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          package_name="agres-$version-macos-universal"
          package_dir="dist/$package_name"
          build_dir="dist/macos-build"
          mkdir -p "$package_dir" "$build_dir"
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o "$build_dir/agres-amd64" .
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o "$build_dir/agres-arm64" .
          lipo -create "$build_dir/agres-amd64" "$build_dir/agres-arm64" -output "$package_dir/agres"
          chmod 755 "$package_dir/agres"
          lipo -info "$package_dir/agres"
          actual_version=$("$package_dir/agres" --version)
          if [[ "$actual_version" != "agres $version" ]]; then
            echo "Built version '$actual_version' does not match tag '$version'." >&2
            exit 1
          fi
          cp LICENSE README.md "$package_dir/"
          ditto -c -k --keepParent "$package_dir" "dist/$package_name.zip"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos-universal
          path: dist/agres-*-macos-universal.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  release:
    name: Create GitHub Release
    needs:
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum agres-* > SHA256SUMS

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --verify-tag \
              --title "agres $tag" \
              --generate-notes
          fi
